{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Release.Name }}-{{ .Values.ambiente }}-secprovclass
  namespace: default
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Release.Name }}-{{ .Values.ambiente }}-secrets-kv
      type: Opaque
      data:
        - objectName: bdusuarios-password
          key: BDUSUARIOS_PASSWORD
        - objectName: bdnotificaciones-password
          key: BDNOTIFICACIONES_PASSWORD
  parameters:
    usePodIdentity: "false"
    clientID: "182078a6-b559-4258-b5b8-8f2349e89264"
    keyvaultName: "kvault-labs"
    tenantId: "d9d2720b-ff02-4f6b-a3b3-a4a937cedc2e"
    objects: |
      array:
        - |
          objectName: bdusuarios-password
          objectType: secret
        - |
          objectName: bdnotificaciones-password
          objectType: secret

{{- end }}